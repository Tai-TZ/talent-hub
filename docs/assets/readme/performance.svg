<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 270" width="968" height="270" role="img" aria-labelledby="t d"><title id="t">Hiệu năng trước và sau tối ưu</title><desc id="d">Sàng lọc 20.000 hồ sơ: 95 lên khoảng 2.000 hồ sơ mỗi giây. Rubric Lab: p95 từ 1.839 xuống 49 mili giây.</desc>
<style>
  :root { --ink: #1f2933; --muted: #52606d; --line: #9aa5b1; --halo: #ffffff; --card: #ffffff; --card-line: #d9e2ec; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e4e7eb; --muted: #9aa5b1; --line: #616e7c; --halo: #0d1117; --card: #161b22; --card-line: #30363d; }
  }
  text { font-family: 'Segoe UI', Montserrat, Helvetica, Arial, sans-serif; fill: var(--ink); }
  .t-title { font-size: 20px; font-weight: 700; }
  .t-label { font-size: 14px; font-weight: 700; }
  .t-small { font-size: 11.5px; fill: var(--muted); }
  .t-tiny { font-size: 10px; fill: var(--muted); }
  .t-on { fill: #ffffff; font-weight: 700; font-size: 12px; }
  .leader { stroke: var(--line); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  .wire { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .card { fill: var(--card); stroke: var(--card-line); }
  .packet { offset-rotate: 0deg; animation: travel var(--dur, 3s) linear infinite; animation-delay: var(--delay, 0s); }
  @keyframes travel { from { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; animation-delay: var(--delay, 0s); transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .float { animation: float 6s ease-in-out infinite; animation-delay: var(--delay, 0s); }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .dash { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -12; } }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--delay, 0s); }
  @keyframes grow { from { transform: scaleX(0); } }
  .fade { animation: fade 1s ease both; animation-delay: var(--delay, 0s); }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .packet, .pulse, .float, .dash, .grow, .fade { animation: none; }
    .packet { offset-distance: 50%; }
  }
</style>
<text class="t-title" x="24" y="34">Hiệu năng ở quy mô 20.000 hồ sơ</text><text class="t-small" x="24" y="54">Đo trên cùng máy, cùng dữ liệu; kết quả trước/sau giống hệt từng dòng (xem WORKLOG).</text><rect class="card" x="24" y="76" width="446" height="176" rx="12"/><text class="t-label" x="44" y="104">Sàng lọc AI 20.000 hồ sơ</text><text class="t-tiny" x="44" y="120">hồ sơ/giây · cao hơn là tốt</text><text class="t-small" x="44" y="157">Trước</text><line x1="94" y1="166" x2="394" y2="166" stroke="var(--card-line)"/><rect class="grow" style="--delay: 0.2s" x="94" y="144" width="14.2" height="20" rx="4" fill="#93a3b5"/><text class="t-label fade" style="--delay: 0.9s" x="116.2" y="159">95</text><text class="t-small" x="44" y="201">Sau</text><line x1="94" y1="210" x2="394" y2="210" stroke="var(--card-line)"/><rect class="grow" style="--delay: 0.6000000000000001s" x="94" y="188" width="300.0" height="20" rx="4" fill="#1d6199"/><text class="t-label fade" style="--delay: 1.3s" x="402.0" y="203">~2.000</text><text class="t-small fade" style="--delay: 1.6s" x="44" y="238">→ nhanh hơn ~20 lần</text><rect class="card" x="494" y="76" width="446" height="176" rx="12"/><text class="t-label" x="514" y="104">Rubric Lab (12.500 hồ sơ)</text><text class="t-tiny" x="514" y="120">p95 mili giây · thấp hơn là tốt</text><text class="t-small" x="514" y="157">Trước</text><line x1="564" y1="166" x2="864" y2="166" stroke="var(--card-line)"/><rect class="grow" style="--delay: 0.2s" x="564" y="144" width="300.0" height="20" rx="4" fill="#93a3b5"/><text class="t-label fade" style="--delay: 0.9s" x="872.0" y="159">1.839 ms</text><text class="t-small" x="514" y="201">Sau</text><line x1="564" y1="210" x2="864" y2="210" stroke="var(--card-line)"/><rect class="grow" style="--delay: 0.6000000000000001s" x="564" y="188" width="8.0" height="20" rx="4" fill="#1d6199"/><text class="t-label fade" style="--delay: 1.3s" x="580.0" y="203">49 ms</text><text class="t-small fade" style="--delay: 1.6s" x="514" y="238">→ nhanh hơn ~37 lần</text></svg>
