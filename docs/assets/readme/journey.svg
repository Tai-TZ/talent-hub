<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 345" width="1180" height="345" role="img" aria-labelledby="t d"><title id="t">Hành trình từ hồ sơ đến kết quả</title><desc id="d">Bảy bước từ nộp hồ sơ đến đánh giá chất lượng chương trình, với vòng phản hồi về Rubric Lab.</desc>
<style>
  :root { --ink: #1f2933; --muted: #52606d; --line: #9aa5b1; --halo: #ffffff; --card: #ffffff; --card-line: #d9e2ec; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e4e7eb; --muted: #9aa5b1; --line: #616e7c; --halo: #0d1117; --card: #161b22; --card-line: #30363d; }
  }
  text { font-family: 'Segoe UI', Montserrat, Helvetica, Arial, sans-serif; fill: var(--ink); }
  .t-title { font-size: 20px; font-weight: 700; }
  .t-label { font-size: 14px; font-weight: 700; }
  .t-small { font-size: 11.5px; fill: var(--muted); }
  .t-tiny { font-size: 10px; fill: var(--muted); }
  .t-on { fill: #ffffff; font-weight: 700; font-size: 12px; }
  .leader { stroke: var(--line); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  .wire { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .card { fill: var(--card); stroke: var(--card-line); }
  .packet { offset-rotate: 0deg; animation: travel var(--dur, 3s) linear infinite; animation-delay: var(--delay, 0s); }
  @keyframes travel { from { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; animation-delay: var(--delay, 0s); transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .float { animation: float 6s ease-in-out infinite; animation-delay: var(--delay, 0s); }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .dash { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -12; } }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--delay, 0s); }
  @keyframes grow { from { transform: scaleX(0); } }
  .fade { animation: fade 1s ease both; animation-delay: var(--delay, 0s); }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .packet, .pulse, .float, .dash, .grow, .fade { animation: none; }
    .packet { offset-distance: 50%; }
  }
</style>
<text class="t-title" x="24" y="34">Từ hồ sơ đến kết quả, rồi quay lại cải tiến tuyển chọn</text><text class="t-small" x="24" y="54">Con người ra mọi quyết định; AI chỉ gợi ý có dẫn chứng. Kết quả đào tạo đi ngược về Rubric Lab để chọn tốt hơn ở khoá sau.</text><path class="wire dash" d="M90.0,212.4 L231.3,212.4 L372.7,212.4 L514.0,212.4 L655.3,212.4 L796.7,212.4 L938.0,212.4"/><g class="float" style="--delay: 0.0s"><g opacity="1.0" ><polygon points="36.0,219.6 90.0,250.8 90.0,272.4 36.0,241.2" fill="#1d6199"/><polygon points="144.0,219.6 90.0,250.8 90.0,272.4 144.0,241.2" fill="#134d8b"/><polygon points="90.0,188.4 144.0,219.6 90.0,250.8 36.0,219.6" fill="#5d9bc8"/></g></g><text class="t-label halo" text-anchor="middle" x="90.0" y="298.4">Nộp hồ sơ</text><text class="t-tiny halo" text-anchor="middle" x="90.0" y="313.4">6 bước, tự lưu</text><g class="float" style="--delay: 0.35s"><g opacity="1.0" ><polygon points="177.3,212.4 231.3,243.6 231.3,272.4 177.3,241.2" fill="#1d6199"/><polygon points="285.4,212.4 231.3,243.6 231.3,272.4 285.4,241.2" fill="#134d8b"/><polygon points="231.3,181.2 285.4,212.4 231.3,243.6 177.3,212.4" fill="#5d9bc8"/></g></g><text class="t-label halo" text-anchor="middle" x="231.3" y="298.4">Sàng lọc AI</text><text class="t-tiny halo" text-anchor="middle" x="231.3" y="313.4">dẫn chứng nguyên văn</text><g class="float" style="--delay: 0.7s"><g opacity="1.0" ><polygon points="318.6,219.6 372.7,250.8 372.7,272.4 318.6,241.2" fill="#1d6199"/><polygon points="426.7,219.6 372.7,250.8 372.7,272.4 426.7,241.2" fill="#134d8b"/><polygon points="372.7,188.4 426.7,219.6 372.7,250.8 318.6,219.6" fill="#5d9bc8"/></g></g><text class="t-label halo" text-anchor="middle" x="372.7" y="298.4">Chấm mù</text><text class="t-tiny halo" text-anchor="middle" x="372.7" y="313.4">AI ẩn đến khi chấm xong</text><g class="float" style="--delay: 1.0499999999999998s"><g opacity="1.0" ><polygon points="460.0,212.4 514.0,243.6 514.0,272.4 460.0,241.2" fill="#1d6199"/><polygon points="568.0,212.4 514.0,243.6 514.0,272.4 568.0,241.2" fill="#134d8b"/><polygon points="514.0,181.2 568.0,212.4 514.0,243.6 460.0,212.4" fill="#5d9bc8"/></g></g><text class="t-label halo" text-anchor="middle" x="514.0" y="298.4">Phê duyệt 4 mắt</text><text class="t-tiny halo" text-anchor="middle" x="514.0" y="313.4">người duyệt ≠ người đề xuất</text><g class="float" style="--delay: 1.4s"><g opacity="1.0" ><polygon points="601.3,219.6 655.3,250.8 655.3,272.4 601.3,241.2" fill="#2f9a62"/><polygon points="709.4,219.6 655.3,250.8 655.3,272.4 709.4,241.2" fill="#0e623a"/><polygon points="655.3,188.4 709.4,219.6 655.3,250.8 601.3,219.6" fill="#7fd1a3"/></g></g><text class="t-label halo" text-anchor="middle" x="655.3" y="298.4">Nhập học</text><text class="t-tiny halo" text-anchor="middle" x="655.3" y="313.4">lớp · nhánh · thực chiến</text><g class="float" style="--delay: 1.75s"><g opacity="1.0" ><polygon points="742.6,212.4 796.7,243.6 796.7,272.4 742.6,241.2" fill="#2f9a62"/><polygon points="850.7,212.4 796.7,243.6 796.7,272.4 850.7,241.2" fill="#0e623a"/><polygon points="796.7,181.2 850.7,212.4 796.7,243.6 742.6,212.4" fill="#7fd1a3"/></g></g><text class="t-label halo" text-anchor="middle" x="796.7" y="298.4">Đánh giá năng lực</text><text class="t-tiny halo" text-anchor="middle" x="796.7" y="313.4">mentor + LMS</text><g class="float" style="--delay: 2.0999999999999996s"><g opacity="1.0" ><polygon points="884.0,219.6 938.0,250.8 938.0,272.4 884.0,241.2" fill="#7b68c9"/><polygon points="992.1,219.6 938.0,250.8 938.0,272.4 992.1,241.2" fill="#5b49a6"/><polygon points="938.0,188.4 992.1,219.6 938.0,250.8 884.0,219.6" fill="#a99be6"/></g></g><text class="t-label halo" text-anchor="middle" x="938.0" y="298.4">Chất lượng CT</text><text class="t-tiny halo" text-anchor="middle" x="938.0" y="313.4">chuẩn đầu ra · cảnh báo</text><rect x="900" y="24" width="12" height="12" rx="3" fill="#1d6199"/><text class="t-small" x="918" y="34">Tuyển sinh</text><rect x="992" y="24" width="12" height="12" rx="3" fill="#2f9a62"/><text class="t-small" x="1010" y="34">Đào tạo</text><rect x="1084" y="24" width="12" height="12" rx="3" fill="#7b68c9"/><text class="t-small" x="1102" y="34">Cải tiến</text><circle class="packet" r="5" fill="#f2c46d" stroke="#ffffff" stroke-width="1.5" style="offset-path: path('M90.0,212.4 L231.3,212.4 L372.7,212.4 L514.0,212.4 L655.3,212.4 L796.7,212.4 L938.0,212.4'); --dur: 9s; --delay: 0.0s"/><circle class="packet" r="5" fill="#f2c46d" stroke="#ffffff" stroke-width="1.5" style="offset-path: path('M90.0,212.4 L231.3,212.4 L372.7,212.4 L514.0,212.4 L655.3,212.4 L796.7,212.4 L938.0,212.4'); --dur: 9s; --delay: 2.25s"/><circle class="packet" r="5" fill="#f2c46d" stroke="#ffffff" stroke-width="1.5" style="offset-path: path('M90.0,212.4 L231.3,212.4 L372.7,212.4 L514.0,212.4 L655.3,212.4 L796.7,212.4 L938.0,212.4'); --dur: 9s; --delay: 4.5s"/><circle class="packet" r="5" fill="#f2c46d" stroke="#ffffff" stroke-width="1.5" style="offset-path: path('M90.0,212.4 L231.3,212.4 L372.7,212.4 L514.0,212.4 L655.3,212.4 L796.7,212.4 L938.0,212.4'); --dur: 9s; --delay: 6.75s"/><path class="wire dash" d="M938.0,182.4 C938.0,102.4 231.3,102.4 231.3,182.4" stroke="#7b68c9" stroke-width="2.2"/><circle class="packet" r="5" fill="#a99be6" stroke="#ffffff" stroke-width="1.5" style="offset-path: path('M938.0,182.4 C938.0,102.4 231.3,102.4 231.3,182.4'); --dur: 4.5s; --delay: 0s"/><circle class="packet" r="5" fill="#a99be6" stroke="#ffffff" stroke-width="1.5" style="offset-path: path('M938.0,182.4 C938.0,102.4 231.3,102.4 231.3,182.4'); --dur: 4.5s; --delay: 2.25s"/><rect class="card" x="434.7" y="108.4" width="300" height="40" rx="8"/><text class="t-label" text-anchor="middle" x="584.7" y="125.4">Rubric Lab</text><text class="t-tiny" text-anchor="middle" x="584.7" y="140.4">tiêu chí nào dự báo thành công · thử trọng số mới · kiểm tra công bằng</text></svg>
