<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 620" width="1220" height="620" role="img" aria-labelledby="t d"><title id="t">Kiến trúc Talent Hub</title><desc id="d">Sơ đồ isometric ba tầng: Next.js BFF, FastAPI, PostgreSQL có RLS; bên cạnh là LLM và các tích hợp.</desc>
<style>
  :root { --ink: #1f2933; --muted: #52606d; --line: #9aa5b1; --halo: #ffffff; --card: #ffffff; --card-line: #d9e2ec; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e4e7eb; --muted: #9aa5b1; --line: #616e7c; --halo: #0d1117; --card: #161b22; --card-line: #30363d; }
  }
  text { font-family: 'Segoe UI', Montserrat, Helvetica, Arial, sans-serif; fill: var(--ink); }
  .t-title { font-size: 20px; font-weight: 700; }
  .t-label { font-size: 14px; font-weight: 700; }
  .t-small { font-size: 11.5px; fill: var(--muted); }
  .t-tiny { font-size: 10px; fill: var(--muted); }
  .t-on { fill: #ffffff; font-weight: 700; font-size: 12px; }
  .leader { stroke: var(--line); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  .wire { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .card { fill: var(--card); stroke: var(--card-line); }
  .packet { offset-rotate: 0deg; animation: travel var(--dur, 3s) linear infinite; animation-delay: var(--delay, 0s); }
  @keyframes travel { from { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; animation-delay: var(--delay, 0s); transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .float { animation: float 6s ease-in-out infinite; animation-delay: var(--delay, 0s); }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .dash { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -12; } }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--delay, 0s); }
  @keyframes grow { from { transform: scaleX(0); } }
  .fade { animation: fade 1s ease both; animation-delay: var(--delay, 0s); }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .packet, .pulse, .float, .dash, .grow, .fade { animation: none; }
    .packet { offset-distance: 50%; }
  }
</style>
<text class="t-title" x="24" y="34">Kiến trúc theo tầng</text><text class="t-small" x="24" y="54">Gói tin vàng: yêu cầu đi xuống · gói xanh: phản hồi · ba lát màu trên DB: dữ liệu của ba tổ chức</text><g class="float" style="--delay: 0.0s"><g opacity="1.0" ><polygon points="404.1,440.0 560.0,530.0 560.0,560.0 404.1,470.0" fill="#4338ca"/><polygon points="715.9,440.0 560.0,530.0 560.0,560.0 715.9,470.0" fill="#312e81"/><polygon points="560.0,350.0 715.9,440.0 560.0,530.0 404.1,440.0" fill="#6366f1"/></g><g opacity="1.0" class="pulse" style="--delay: 0.0s"><polygon points="435.3,434.6 471.7,455.6 471.7,461.0 435.3,440.0" fill="#d39a2c"/><polygon points="596.4,383.6 471.7,455.6 471.7,461.0 596.4,389.0" fill="#a87418"/><polygon points="560.0,362.6 596.4,383.6 471.7,455.6 435.3,434.6" fill="#f2c46d"/></g><g opacity="1.0" class="pulse" style="--delay: 0.8s"><polygon points="479.5,460.1 515.8,481.1 515.8,486.5 479.5,465.5" fill="#7b68c9"/><polygon points="640.5,409.1 515.8,481.1 515.8,486.5 640.5,414.5" fill="#5b49a6"/><polygon points="604.2,388.1 640.5,409.1 515.8,481.1 479.5,460.1" fill="#a99be6"/></g><g opacity="1.0" class="pulse" style="--delay: 1.6s"><polygon points="523.6,485.6 560.0,506.6 560.0,512.0 523.6,491.0" fill="#2f9a62"/><polygon points="684.7,434.6 560.0,506.6 560.0,512.0 684.7,440.0" fill="#0e623a"/><polygon points="648.3,413.6 684.7,434.6 560.0,506.6 523.6,485.6" fill="#7fd1a3"/></g></g><path class="leader" d="M719.9,455.0 L852,455.0"/><text class="t-label halo" x="860" y="453.0">PostgreSQL 16 · RLS theo tổ chức</text><text class="t-small halo" x="860" y="469.0">một schema · FORCE RLS · vai trò runtime không BYPASSRLS</text><g class="float" style="--delay: 0.6s"><g opacity="1.0" ><polygon points="404.1,332.0 560.0,422.0 560.0,452.0 404.1,362.0" fill="#4f46e5"/><polygon points="715.9,332.0 560.0,422.0 560.0,452.0 715.9,362.0" fill="#4338ca"/><polygon points="560.0,242.0 715.9,332.0 560.0,422.0 404.1,332.0" fill="#818cf8"/></g><g opacity="0.95" ><polygon po