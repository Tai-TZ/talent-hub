<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="t d"><title id="t">Cô lập dữ liệu theo tổ chức</title><desc id="d">Ba lớp dữ liệu của ba tổ chức trong một database; truy vấn với app.org_id = northwind chỉ đọc được lớp northwind.</desc>
<style>
  :root { --ink: #1f2933; --muted: #52606d; --line: #9aa5b1; --halo: #ffffff; --card: #ffffff; --card-line: #d9e2ec; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e4e7eb; --muted: #9aa5b1; --line: #616e7c; --halo: #0d1117; --card: #161b22; --card-line: #30363d; }
  }
  text { font-family: 'Segoe UI', Montserrat, Helvetica, Arial, sans-serif; fill: var(--ink); }
  .t-title { font-size: 20px; font-weight: 700; }
  .t-label { font-size: 14px; font-weight: 700; }
  .t-small { font-size: 11.5px; fill: var(--muted); }
  .t-tiny { font-size: 10px; fill: var(--muted); }
  .t-on { fill: #ffffff; font-weight: 700; font-size: 12px; }
  .leader { stroke: var(--line); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  .wire { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .card { fill: var(--card); stroke: var(--card-line); }
  .packet { offset-rotate: 0deg; animation: travel var(--dur, 3s) linear infinite; animation-delay: var(--delay, 0s); }
  @keyframes travel { from { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; animation-delay: var(--delay, 0s); transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .float { animation: float 6s ease-in-out infinite; animation-delay: var(--delay, 0s); }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .dash { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -12; } }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--delay, 0s); }
  @keyframes grow { from { transform: scaleX(0); } }
  .fade { animation: fade 1s ease both; animation-delay: var(--delay, 0s); }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .packet, .pulse, .float, .dash, .grow, .fade { animation: none; }
    .packet { offset-distance: 50%; }
  }
</style>
<text class="t-title" x="24" y="34">Mỗi truy vấn chỉ thấy dữ liệu của tổ chức mình</text><text class="t-small" x="24" y="54">Tên miền → app.org_id → policy RLS trên mọi bảng thuộc tổ chức. Thiếu policy là test CI đỏ.</text><g opacity="0.28" ><polygon points="150.1,302.5 280.0,377.5 280.0,400.0 150.1,325.0" fill="#2f9a62"/><polygon points="409.9,302.5 280.0,377.5 280.0,400.0 409.9,325.0" fill="#0e623a"/><polygon points="280.0,227.5 409.9,302.5 280.0,377.5 150.1,302.5" fill="#7fd1a3"/></g><path class="leader" d="M413.9,313.0 L479.9,313.0"/><text class="t-label halo" x="487.9" y="317.0">scale</text><text class="t-small halo" x="538.4" y="317.0">— bị chặn bởi RLS</text><g opacity="0.28" ><polygon points="150.1,251.5 280.0,326.5 280.0,349.0 150.1,274.0" fill="#7b68c9"/><polygon points="409.9,251.5 280.0,326.5 280.0,349.0 409.9,274.0" fill="#5b49a6"/><polygon points="280.0,176.5 409.9,251.5 280.0,326.5 150.1,251.5" fill="#a99be6"/></g><path class="leader" d="M413.9,262.0 L479.9,262.0"/><text class="t-label halo" x="487.9" y="266.0">demo-uni</text><text class="t-small halo" x="563.9" y="266.0">— bị chặn bởi RLS</text><g opacity="1.0" ><polygon points="150.1,200.5 280.0,275.5 280.0,298.0 150.1,223.0" fill="#d39a2c"/><polygon points="409.9,200.5 280.0,275.5 280.0,298.0 409.9,223.0" fill="#a87418"/><polygon points="280.0,125.5 409.9,200.5 280.0,275.5 150.1,200.5" fill="#f2c46d"/></g><polygon class="pulse" points="280.0,125.5 409.9,200.5 280.0,275.5 150.1,200.5" fill="none" stroke="#ffd36b" stroke-width="3"/><path class="leader" d="M413.9,211.0 L479.9,211.0"/><text class="t-label halo" x="487.9" y="215.0">northwind</text><text class="t-small halo" x="546.9" y="215.0">— được đọc</text><path class="wire dash" d="M280.0,127.0 L280.0,200.5" stroke="#387aad" stroke-width="2.4"/><circle class="packet" r="5.5" fill="#134d8b" stroke="#ffffff" stroke-width="1.5" style="offset-path: path('M280.0,127.0 L280.0,200.5'); --dur: 2.4s; --delay: 0.0s"/><circle class="packet" r="5.5" fill="#134d8b" stroke="#ffffff" stroke-width="1.5" style="offset-path: path('M280.0,127.0 L280.0,200.5'); --dur: 2.4s; --delay: 0.8s"/><circle class="packet" r="5.5" fill="#134d8b" stroke="#ffffff" stroke-width="1.5" style="offset-path: path('M280.0,127.0 L280.0,200.5'); --dur: 2.4s; --delay: 1.6s"/><rect class="card" x="160.0" y="81.0" width="240" height="34" rx="8"/><text class="t-small" text-anchor="middle" x="280.0" y="103.0">SET LOCAL app.org_id = northwind</text></svg>
