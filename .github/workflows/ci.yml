name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talenthub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d talenthub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create DB roles
        run: psql "postgresql://postgres:postgres@localhost:5432/talenthub" -f ../db/init/01-roles.sql

      - name: Lint
        run: |
          ruff check src tests migrations tools
          ruff format --check src tests migrations tools

      - name: Type check
        run: mypy src

      - name: Test (với kiểm tra độ phủ)
        run: pytest --cov

      - name: Dependency audit
        run: pip-audit -r requirements.txt

  semgrep:
    name: Security scan (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: semgrep scan --config p/ci --config p/python --config p/typescript --error --metrics=off backend/src frontend/src

  frontend:
    name: Frontend (lint, type, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
